<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <h1>Pomodoro</h1>

      <span id="mode-label" class="mode-label">집중</span>

      <div class="timer">
        <span class="time">25:00</span>
      </div>

      <span id="progress" class="progress">1 / 1</span>

      <div class="count-selector">
        <label for="pomodoro-count">뽀모도로 횟수</label>
        <input
          type="number"
          id="pomodoro-count"
          min="1"
          max="100"
          value="1"
          oninput="updateModeUI()"
        />
      </div>

      <div class="controls">
        <button class="btn btn-start" onclick="startTimer()">시작</button>
        <button class="btn btn-stop" onclick="stopTimer()">정지</button>
        <button class="btn btn-reset" onclick="resetTimer()">초기화</button>
      </div>

      <button
        class="btn btn-settings"
        onclick="location.href = 'settings.html'"
      >
        설정
      </button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
