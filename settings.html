<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro - Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="container">
      <h3>Setting</h3>

      <div class="form-group">
        <label for="timer-minutes">집중 시간 (분)</label>
        <input type="number" id="timer-minutes" min="5" max="60" step="5" value="25" />
      </div>

      <div class="form-group">
        <label for="break-minutes">휴식 시간 (분)</label>
        <input type="number" id="break-minutes" min="5" max="60" step="5" value="5" />
      </div>

      <button class="btn btn-save" onclick="saveSettings()">설정 완료</button>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
